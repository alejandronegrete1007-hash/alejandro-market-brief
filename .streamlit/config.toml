[theme]
base = "dark"
primaryColor = "#7FA7FF"
backgroundColor = "#121417"
secondaryBackgroundColor = "#1A1D22"
textColor = "#E4E6EA"
borderColor = "#2A2E35"
baseRadius = "6px"
font = "'Inter Tight':https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
headingFont = "Spectral:https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap"
codeFont = "'Inter Tight':https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap"

[client]
toolbarMode = "minimal"

[server]
headless = true
