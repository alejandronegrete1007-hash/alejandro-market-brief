name: Checks

# Unit tests on every push; the SEC data check on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers for the SEC data check (comma-separated)"
        required: false
      probe:
        description: "Also list the newest annual report's debt, capex and payables tags (any text = yes)"
        required: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Treasury curve dates (one-off)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.probe == 'curve'
        run: python scripts/probe_curve.py
      - name: SEC data check
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.probe != 'curve'
        run: python scripts/check_filings.py
        env:
          CHECK_TICKERS: ${{ github.event.inputs.tickers || 'MU,AAPL,AMX,FMX,KOF,CX,ASR,PAC,OMAB,TV,TSM' }}
          PROBE_TAGS: ${{ github.event.inputs.probe }}
