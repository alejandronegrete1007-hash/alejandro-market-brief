name: Checks

# Unit tests on every push; the SEC data check on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: SEC data check
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_filings.py
      - name: IFRS probe (Mexican ADRs)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/probe_ifrs2.py
